# Automat Typer49: aktualizacja wyników, testy i publikacja na GitHub Pages.
# Losowania: wtorek, czwartek, sobota o 22:00 czasu polskiego
# (= 21:00 UTC zimą, 20:00 UTC latem). Sprawdzamy kilka razy po losowaniu
# i jeszcze raz następnego dnia – na wypadek opóźnień źródła.
#
# Zasady:
#  - Wyniki losowań są aktualizowane i publikowane ZAWSZE, nawet gdy testy nie przejdą.
#  - Nowy kod trafia na stronę tylko wtedy, gdy testy przejdą. Przy nieudanych testach
#    publikowany jest ostatni sprawdzony kod (gałąź last-good) z nowymi wynikami,
#    a cały przebieg kończy się błędem – GitHub wysyła wtedy e-mail do właściciela.
#  - Na gałęziach innych niż main uruchamiają się tylko testy (bez publikacji).
name: Aktualizacja wyników i publikacja

on:
  schedule:
    - cron: "40 21 * * 2,4,6"   # wt/czw/sob 21:40 UTC
    - cron: "30 22 * * 2,4,6"   # wt/czw/sob 22:30 UTC
    - cron: "30 23 * * 2,4,6"   # wt/czw/sob 23:30 UTC
    - cron: "15 5 * * 3,5,0"    # śr/pt/nd 05:15 UTC
    - cron: "0 12 * * *"        # codziennie 12:00 UTC (zapas)
  push:
    branches: ["**"]
  workflow_dispatch: {}          # przycisk "Run workflow" w zakładce Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ testy kodu
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sprawdzenie składni plików JS
        run: |
          for f in app.js cloud.js time.js bilans.js systemy.js config.js sw.js; do node --check "$f" && echo "OK $f" || exit 1; done

      - name: Testy logiki czasu w różnych strefach czasowych
        run: |
          fail=0
          for tz in Europe/Warsaw UTC Europe/London America/New_York Asia/Tokyo Australia/Sydney; do
            echo "::group::Strefa urządzenia: $tz"
            TZ="$tz" node --test tests/*.test.js || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" != 0 ]; then echo "::error::Testy nie przeszły – nowy kod NIE zostanie opublikowany."; exit 1; fi

      - name: Testy Strażnika (progi alarmów)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

  # ------------------------------------------------------------------ wyniki losowań (niezależnie od testów)
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz najnowsze wyniki
        run: python scripts/update_data.py

      - name: Zapisz zmiany w repozytorium
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name  "lotto-bot"
            git config user.email "lotto-bot@users.noreply.github.com"
            git add data
            git commit -m "Aktualizacja wyników $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -q origin main
            git push
          else
            echo "Brak nowych wyników."
          fi

      # Darmowy plan Supabase usypia bazę po 7 dniach bez ruchu – automat ją "budzi" przy każdym uruchomieniu.
      - name: Podtrzymaj bazę Supabase
        continue-on-error: true
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" config.js || true)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" config.js || true)
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            curl -s -o /dev/null -w "Supabase: HTTP %{http_code}\n" "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          else
            echo "Supabase nieskonfigurowany – pomijam."
          fi

  # ------------------------------------------------------------------ publikacja
  deploy:
    needs: [test, update-data]
    if: always() && github.ref == 'refs/heads/main' && needs.update-data.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Złóż stronę (kod sprawdzony testami + najnowsze wyniki)
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -e
          git fetch -q origin main
          git fetch -q origin last-good 2>/dev/null || true
          if [ "$TEST_RESULT" = "success" ]; then
            CODE="$GITHUB_SHA"
            echo "Testy przeszły – publikuję bieżący kod."
          elif git rev-parse -q --verify refs/remotes/origin/last-good >/dev/null; then
            CODE="origin/last-good"
            echo "::warning::Testy nie przeszły – publikuję OSTATNI SPRAWDZONY kod z nowymi wynikami."
          else
            echo "::error::Testy nie przeszły i nie ma jeszcze sprawdzonej wersji kodu – pomijam publikację."
            exit 1
          fi
          mkdir _site
          git archive "$CODE" | tar -x -C _site
          rm -rf _site/data _site/.github _site/.claude
          git archive origin/main data | tar -x -C _site
          echo "Kod: $(git rev-parse --short "$CODE") · wyniki: $(git rev-parse --short origin/main)"
          if [ "$TEST_RESULT" = "success" ]; then
            git push -q -f origin "$GITHUB_SHA:refs/heads/last-good"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
